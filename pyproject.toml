[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macos-task-scheduler"
version = "0.0.4"
description = "A human-friendly macOS task scheduler built on top of Apple's launchd"
readme = "README.md"
license = "MIT"
authors = [
    { name = "John Hoaglun" },
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/task_scheduler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["task_scheduler"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
